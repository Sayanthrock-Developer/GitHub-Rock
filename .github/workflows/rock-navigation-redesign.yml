name: Apply GitHub Rock navigation redesign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply animated navigation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/sayanthrock/githubrock/ui/navigation/AppNavigation.kt')
          text = path.read_text(encoding='utf-8')
          marker = '// ROCK_NAV_V2'

          if marker in text:
              print('Navigation redesign already applied.')
              raise SystemExit(0)

          signature = '@Composable\ninternal fun AppNavigationBar('
          start = text.find(signature)
          if start < 0:
              raise SystemExit('Could not find AppNavigationBar.')
          brace = text.find('{', start)
          if brace < 0:
              raise SystemExit('Could not find AppNavigationBar body.')

          depth = 0
          in_string = in_char = escaped = line_comment = block_comment = False
          i = brace
          end = None
          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ''
              if line_comment:
                  if c == '\n': line_comment = False
              elif block_comment:
                  if c == '*' and n == '/': block_comment = False; i += 1
              elif in_string:
                  if escaped: escaped = False
                  elif c == '\\': escaped = True
                  elif c == '"': in_string = False
              elif in_char:
                  if escaped: escaped = False
                  elif c == '\\': escaped = True
                  elif c == "'": in_char = False
              else:
                  if c == '/' and n == '/': line_comment = True; i += 1
                  elif c == '/' and n == '*': block_comment = True; i += 1
                  elif c == '"': in_string = True
                  elif c == "'": in_char = True
                  elif c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1

          if end is None:
              raise SystemExit('Could not determine AppNavigationBar end.')

          replacement = '''@Composable
internal fun AppNavigationBar(
    selectedRoute: String?,
    onDestinationSelected: (TopDestination) -> Unit,
    modifier: Modifier = Modifier
) {
    // ROCK_NAV_V2
    val dockShape = RoundedCornerShape(38.dp)

    Box(
        modifier = modifier
            .fillMaxWidth()
            .navigationBarsPadding()
            .padding(horizontal = 10.dp, vertical = 7.dp),
        contentAlignment = Alignment.BottomCenter
    ) {
        Box(
            modifier = Modifier
                .fillMaxWidth()
                .widthIn(max = 620.dp)
                .height(94.dp)
        ) {
            Box(
                modifier = Modifier
                    .matchParentSize()
                    .padding(horizontal = 7.dp, vertical = 5.dp)
                    .blur(24.dp, edgeTreatment = BlurredEdgeTreatment.Unbounded)
                    .clip(dockShape)
                    .background(MobileDockBackdrop.copy(alpha = .55f))
            )
            Box(
                modifier = Modifier
                    .matchParentSize()
                    .shadow(22.dp, dockShape, clip = false)
                    .clip(dockShape)
                    .background(
                        Brush.verticalGradient(
                            listOf(Color(0xE6131414), Color(0xC9050606))
                        )
                    )
                    .border(1.dp, Color(0xFF343735).copy(alpha = .9f), dockShape)
            ) {
                Box(
                    modifier = Modifier
                        .fillMaxWidth()
                        .height(1.dp)
                        .padding(horizontal = 30.dp)
                        .background(
                            Brush.horizontalGradient(
                                listOf(
                                    Color.Transparent,
                                    Color.White.copy(alpha = .20f),
                                    Color.Transparent
                                )
                            )
                        )
                )
                Row(
                    modifier = Modifier
                        .fillMaxSize()
                        .padding(horizontal = 7.dp, vertical = 7.dp)
                        .selectableGroup(),
                    horizontalArrangement = Arrangement.spacedBy(2.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    topDestinations.forEach { destination ->
                        NavigationDockItemV2(
                            destination = destination,
                            selected = selectedRoute == destination.route,
                            onClick = { onDestinationSelected(destination) }
                        )
                    }
                }
            }
        }
    }
}

@Composable
private fun RowScope.NavigationDockItemV2(
    destination: TopDestination,
    selected: Boolean,
    onClick: () -> Unit
) {
    val itemHeight by animateDpAsState(
        targetValue = if (selected) 80.dp else 62.dp,
        animationSpec = tween(280),
        label = "navigation item height"
    )
    val iconSize by animateDpAsState(
        targetValue = if (selected) 31.dp else 25.dp,
        animationSpec = tween(240),
        label = "navigation icon size"
    )
    val horizontalInset by animateDpAsState(
        targetValue = if (selected) 2.dp else 10.dp,
        animationSpec = tween(260),
        label = "navigation item inset"
    )
    val elevation by animateDpAsState(
        targetValue = if (selected) 13.dp else 0.dp,
        animationSpec = tween(280),
        label = "navigation item elevation"
    )
    val shape = RoundedCornerShape(if (selected) 36.dp else 28.dp)

    Box(
        modifier = Modifier
            .weight(1f)
            .fillMaxHeight()
            .padding(horizontal = horizontalInset, vertical = 2.dp)
            .shadow(elevation, shape, clip = false)
            .clip(shape)
            .then(
                if (selected) {
                    Modifier
                        .background(
                            Brush.verticalGradient(
                                listOf(MobileDockSelectedTop, MobileDockSelectedBottom)
                            )
                        )
                        .border(
                            BorderStroke(1.dp, MobileDockSelectedBorder.copy(alpha = .82f)),
                            shape
                        )
                } else Modifier
            )
            .selectable(selected = selected, role = Role.Tab, onClick = onClick)
            .semantics(mergeDescendants = true) {
                contentDescription = destination.accessibilityLabel
            },
        contentAlignment = Alignment.Center
    ) {
        Column(
            modifier = Modifier.padding(horizontal = 2.dp, vertical = 7.dp),
            horizontalAlignment = Alignment.CenterHorizontally,
            verticalArrangement = Arrangement.Center
        ) {
            Icon(
                imageVector = destination.icon,
                contentDescription = null,
                modifier = Modifier.size(iconSize),
                tint = if (selected) MobileDockSelectedContent else MobileDockMuted
            )
            Spacer(Modifier.height(if (selected) 5.dp else 4.dp))
            Text(
                text = destination.label,
                color = if (selected) MobileDockSelectedContent else MobileDockMuted,
                maxLines = 1,
                fontSize = if (selected) 12.sp else 11.sp,
                fontWeight = if (selected) FontWeight.ExtraBold else FontWeight.Medium
            )
        }
    }
}
'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('Navigation bar updated.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- app/src/main/java/com/sayanthrock/githubrock/ui/navigation/AppNavigation.kt; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sayanthrock/githubrock/ui/navigation/AppNavigation.kt
          git commit -m "feat: add animated GitHub Rock navigation bar"
          git push origin HEAD:main
          git rm -f .github/workflows/rock-navigation-redesign.yml
          git commit -m "chore: remove temporary navigation updater"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
