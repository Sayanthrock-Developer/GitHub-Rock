name: Repair AppearanceScreen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[appearance-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Add missing GitHub code style branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt')
          text = path.read_text()
          old = '        CodeColorStyle.Monochrome -> "Mono"\n    }'
          new = '        CodeColorStyle.Monochrome -> "Mono"\n        CodeColorStyle.GitHub -> "GitHub"\n    }'
          if old not in text:
              raise SystemExit('Expected CodeColorStyle displayName block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/repair-appearance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt .github/workflows/repair-appearance.yml
          git commit -m 'fix: handle GitHub code color style [appearance-repair]'
          git push
