name: README Documentation Reader bootstrap
on:
  push:
    branches: [fix/readme-documentation-reader]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/readme-documentation-reader
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply README fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/sayanthrock/githubrock/ui/screens/RepositoryHubContent.kt')
          s=p.read_text()
          a='blocks.take(MAX_README_BLOCKS).forEach { MarkdownBlockView(it) }'
          assert a in s
          s=s.replace(a,'blocks.forEach { MarkdownBlockView(it) }')
          a='''            if (blocks.size > MAX_README_BLOCKS) {\n                HorizontalDivider()\n                Text(\n                    "README preview shortened for performance. Use the Code tool to open the complete repository documentation.",\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    style = MaterialTheme.typography.bodySmall\n                )\n            }'''
          assert a in s
          s=s.replace(a,'')
          a='''        MarkdownBlockKind.Divider -> HorizontalDivider()\n        MarkdownBlockKind.Image -> AsyncImage('''
          b='''        MarkdownBlockKind.Divider -> HorizontalDivider()\n        MarkdownBlockKind.Table -> block.table?.let { table ->\n            Surface(\n                modifier = Modifier.fillMaxWidth(),\n                shape = RoundedCornerShape(14.dp),\n                color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = .35f),\n                border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline.copy(alpha = .4f))\n            ) {\n                Column(Modifier.horizontalScroll(rememberScrollState())) {\n                    Row(Modifier.padding(10.dp), horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                        table.headers.forEach { Text(it, fontWeight = FontWeight.Bold, modifier = Modifier.width(120.dp)) }\n                    }\n                    table.rows.forEach { row ->\n                        HorizontalDivider()\n                        Row(Modifier.padding(10.dp), horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                            row.forEach { Text(it, modifier = Modifier.width(120.dp)) }\n                        }\n                    }\n                }\n            }\n        }\n        MarkdownBlockKind.Image -> AsyncImage('''
          assert a in s
          s=s.replace(a,b)
          s=s.replace('private const val MAX_README_BLOCKS = 20\n','')
          p.write_text(s)
          PY
      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon --console=plain --max-workers=1
      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon --console=plain --max-workers=1
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain --max-workers=1
      - name: Remove bootstrap workflow
        run: rm .github/workflows/readme-fix-bootstrap.yml
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sayanthrock/githubrock/ui/screens/RepositoryHubContent.kt .github/workflows/readme-fix-bootstrap.yml
          git commit -m "fix(readme): render complete native documentation"
          git push origin HEAD:fix/readme-documentation-reader
