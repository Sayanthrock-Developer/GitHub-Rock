name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_CLIENT_ID: ${{ vars.PUBLIC_GITHUB_OAUTH_CLIENT_ID || 'Ov23lim8WhLjeUMqvuMj' }}
      GITHUB_ROCK_BACKEND_URL: ${{ vars.GITHUB_ROCK_BACKEND_URL || '' }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Verify release tooling
        run: bash tools/release/test-extract-apksigner-cert-sha256.sh

      - name: Run Android unit tests
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          --stacktrace
          --no-daemon
          --console=plain
          --max-workers=1

      - name: Run Android lint
        run: >-
          ./gradlew
          :app:lintDebug
          --stacktrace
          --no-daemon
          --console=plain
          --max-workers=1

      - name: Build debug APK
        run: >-
          ./gradlew
          :app:assembleDebug
          --stacktrace
          --no-daemon
          --console=plain
          --max-workers=1

      - name: Generate build verification metadata
        env:
          APP_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/verification
          VERSION_NAME="$(./gradlew -q :app:properties | sed -n 's/^version: //p' | head -n 1)"
          VERSION_NAME="${VERSION_NAME:-unknown}"
          VERSION_CODE="${{ github.run_number }}"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          APK_SHA256=""
          if [ -n "$APK" ]; then
            APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          fi
          cat > app/build/outputs/verification/build-metadata.json <<EOF
          {
            "appVersion": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "buildType": "debug",
            "gitCommit": "${GITHUB_SHA}",
            "gitRef": "${GITHUB_REF_NAME}",
            "androidMinSdk": 29,
            "androidCompileSdk": 36,
            "androidTargetSdk": 36,
            "buildTimestampUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${GITHUB_WORKFLOW}",
            "workflowRunId": ${GITHUB_RUN_ID},
            "buildStatus": "passed",
            "unitTests": "passed",
            "uiTests": "not-run",
            "lint": "passed",
            "security": "not-run",
            "codeql": "not-run",
            "releaseCertificateSha256": "not-applicable-debug",
            "apkSha256": "${APK_SHA256}"
          }
          EOF

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-rock-verification
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/verification/build-metadata.json
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
