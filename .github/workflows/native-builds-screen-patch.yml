name: Patch Builds screen native run navigation
on:
  push:
    paths:
      - .github/workflows/native-builds-screen-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BuildsScreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/sayanthrock/githubrock/ui/screens/BuildsScreen.kt')
          s=p.read_text()
          if 'onOpenRun: (GitHubRepositoryModel, WorkflowRun)' not in s:
              s=s.replace('    onSelectRepository: (GitHubRepositoryModel) -> Unit,\n', '    onSelectRepository: (GitHubRepositoryModel) -> Unit,\n    onOpenRun: (GitHubRepositoryModel, WorkflowRun) -> Unit = { _, _ -> },\n', 1)
          s=s.replace('    var selectedRun by remember { mutableStateOf<WorkflowRun?>(null) }\n', '')
          s=s.replace('RecentRunCard(run, preferences) { selectedRun = run }', 'RecentRunCard(run, preferences) { selectedRepository?.let { repo -> onOpenRun(repo, run) } }')
          s=s.replace('    selectedRun?.let { run -> RunDetailsDialog(run, selectedRepository?.fullName, preferences) { selectedRun = null } }\n', '')
          p.write_text(s)
          PY
          git diff -- app/src/main/java/com/sayanthrock/githubrock/ui/screens/BuildsScreen.kt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/native-builds-screen-patch.yml
          git add app/src/main/java/com/sayanthrock/githubrock/ui/screens/BuildsScreen.kt
          git commit -m 'Route workflow runs to native build details'
          git push
