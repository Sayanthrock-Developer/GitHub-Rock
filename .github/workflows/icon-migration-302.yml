name: One-time Rock icon migration

on:
  push:
    branches:
      - fix/icon-migration-302

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('app/src/main/java')
          pattern=re.compile(r'Icons\.(?:Default|Filled|Outlined|Rounded|Sharp|TwoTone)\.([A-Za-z0-9_]+)')
          used=set(); changed=[]
          for p in root.rglob('*.kt'):
            if p.as_posix().endswith('ui/icons/RockIcons.kt'): continue
            s=p.read_text()
            names=set(pattern.findall(s))
            if not names: continue
            used |= names
            s=re.sub(r'^import androidx\.compose\.material\.icons(?:\.[A-Za-z0-9_*]+)?\s*\n?', '', s, flags=re.M)
            s=pattern.sub(lambda m:f'RockIcon.{m.group(1)}.vector()', s)
            imp='import com.sayanthrock.githubrock.ui.icons.RockIcon'
            if imp not in s:
              i=s.find('import '); s=s[:i]+imp+'\n'+s[i:]
            p.write_text(s); changed.append(p)
          rock=root/'com/sayanthrock/githubrock/ui/icons/RockIcons.kt'; s=rock.read_text()
          m=re.search(r'enum class RockIcon \{(.*?)\n\}',s,re.S)
          existing={x.strip() for x in m.group(1).replace('\n',' ').split(',') if x.strip()}
          missing=sorted(used-existing)
          for n in missing:
            snake=re.sub(r'(?<!^)(?=[A-Z])','_',n).lower()
            alias=f'{n}Regular'
            imp=f'import com.composables.icons.materialsymbols.rounded.{snake} as {alias}'
            if imp not in s: s=s.replace('import androidx.compose.ui.graphics.vector.ImageVector\n','import androidx.compose.ui.graphics.vector.ImageVector\n'+imp+'\n',1)
            s=s.replace('\n    Back,',f'\n    {n},\n    Back,',1)
            s=s.replace('\n}',f'\n    RockIcon.{n} -> {alias}\n}',1)
          rock.write_text(s)
          print('changed',len(changed),'missing',missing)
          PY
      - name: Verify
        run: |
          ! grep -RIn --include='*.kt' 'androidx.compose.material.icons\|Icons\.Default\.\|Icons\.Filled\.\|Icons\.Outlined\.\|Icons\.Rounded\.\|Icons\.Sharp\.\|Icons\.TwoTone\.' app/src/main/java
      - name: Commit and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java .github/workflows/icon-migration-302.yml
          git rm .github/workflows/icon-migration-302.yml
          git commit -m 'fix: complete Rock icon migration #302' || exit 0
          git push
