name: One-time Rock icon migration

on:
  push:
    branches:
      - fix/icon-migration-302

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate legacy Compose Material icons
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java')
          pattern = re.compile(r'Icons\.(?:Default|Filled|Outlined|Rounded|Sharp|TwoTone)\.([A-Za-z0-9_]+)')
          used = set()
          changed = []

          for path in root.rglob('*.kt'):
              if path.as_posix().endswith('ui/icons/RockIcons.kt'):
                  continue
              text = path.read_text()
              names = set(pattern.findall(text))
              if not names and 'androidx.compose.material.icons' not in text:
                  continue
              used.update(names)
              lines = [line for line in text.splitlines() if not line.startswith('import androidx.compose.material.icons')]
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              text = pattern.sub(lambda m: 'RockIcon.' + m.group(1) + '.vector()', text)
              if names:
                  imp = 'import com.sayanthrock.githubrock.ui.icons.RockIcon'
                  if imp not in text:
                      pos = text.find('import ')
                      text = text[:pos] + imp + '\n' + text[pos:]
                  path.write_text(text)
                  changed.append(str(path))

          rock = root / 'com/sayanthrock/githubrock/ui/icons/RockIcons.kt'
          text = rock.read_text()
          enum_start = text.index('enum class RockIcon {') + len('enum class RockIcon {')
          enum_end = text.index('\n}', enum_start)
          existing = {x.strip() for x in text[enum_start:enum_end].replace('\n', ' ').split(',') if x.strip()}
          missing = sorted(used - existing)

          def snake(name):
              return re.sub(r'(?<!^)(?=[A-Z])', '_', name).lower()

          for name in missing:
              enum_pos = text.index('\n    Back,', enum_start)
              text = text[:enum_pos] + '\n    ' + name + ',' + text[enum_pos:]
              alias = name + 'Regular'
              import_line = 'import com.composables.icons.materialsymbols.rounded.' + snake(name) + ' as ' + alias
              marker = 'import androidx.compose.ui.graphics.vector.ImageVector\n'
              text = text.replace(marker, marker + import_line + '\n', 1)
              vector_pos = text.rfind('\n}')
              text = text[:vector_pos] + '\n    RockIcon.' + name + ' -> ' + alias + text[vector_pos:]

          rock.write_text(text)
          print('Changed files:', len(changed))
          print('New mappings:', ', '.join(missing) if missing else 'none')
          PY
      - name: Verify source migration
        shell: bash
        run: |
          if grep -RIn --include='*.kt' -E 'androidx\.compose\.material\.icons|Icons\.(Default|Filled|Outlined|Rounded|Sharp|TwoTone)\.' app/src/main/java; then
            exit 1
          fi
      - name: Commit migration and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git rm .github/workflows/icon-migration-302.yml
          git commit -m 'fix: complete Rock icon migration #302' || exit 0
          git push
