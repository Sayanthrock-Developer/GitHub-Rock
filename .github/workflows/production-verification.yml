name: Production Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_CLIENT_ID: ${{ vars.PUBLIC_GITHUB_OAUTH_CLIENT_ID || 'Ov23lim8WhLjeUMqvuMj' }}
      GITHUB_ROCK_BACKEND_URL: ${{ vars.GITHUB_ROCK_BACKEND_URL || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Migrate legacy Compose icons to RockIcon
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("app/src/main/java")
          mapping = {
              "ArrowBack": "Back", "ContentCopy": "Copy", "CheckCircle": "Check",
              "ErrorOutline": "Error", "WarningAmber": "Error", "InsertDriveFile": "Description",
              "Cancel": "Close", "Build": "Builds",
          }
          allowed = {
              "Home", "Explore", "Repositories", "Builds", "Downloads", "Profile", "Settings",
              "Back", "ArrowForward", "Search", "Chat", "Check", "Error", "AccountCircle",
              "Announcement", "AutoAwesome", "ChevronRight", "Favorite", "FavoriteBorder", "History",
              "Info", "Logout", "Star", "Tune", "Archive", "Code", "Download", "Notifications",
              "Security", "Lock", "Copy", "OpenInBrowser", "ExpandLess", "ExpandMore", "Refresh",
              "Stop", "Sync", "Timer", "FolderOpen", "OpenInNew", "Public", "CloudDownload", "Palette",
              "Person", "PersonAdd", "PersonRemove", "PrivacyTip", "Storage", "CallSplit", "Tag",
              "Description", "UploadFile", "Add", "ArrowDropDown", "Close", "Android", "Devices",
              "LaptopMac", "DesktopWindows", "PhoneIphone", "Terminal", "BatterySaver", "Delete",
              "ViewCompact", "InstallMobile", "Launch", "CheckBox", "CheckBoxOutlineBlank",
              "Business", "Pause", "PlayArrow", "Schedule", "Share", "Link", "MoreHoriz",
              "Email", "Language", "Edit", "Menu", "MoreVert", "FilterList", "Visibility",
              "VisibilityOff", "PersonSearch",
          }
          icon_re = re.compile(r"Icons\.(?:Default|Filled|Outlined|Rounded|Sharp|TwoTone)\.([A-Za-z0-9_]+)")
          import_re = re.compile(r"^import androidx\.compose\.material\.icons(?:\..*)?$", re.MULTILINE)
          unresolved = set()
          changed = []

          for path in root.rglob("*.kt"):
              if path.name == "RockIcons.kt":
                  continue
              text = path.read_text(encoding="utf-8")
              if "androidx.compose.material.icons" not in text and not icon_re.search(text):
                  continue
              def replace(match):
                  name = mapping.get(match.group(1), match.group(1))
                  if name not in allowed:
                      unresolved.add(match.group(1))
                  return f"RockIcon.{name}.vector()"
              new_text = icon_re.sub(replace, text)
              new_text = import_re.sub("", new_text)
              if "RockIcon." in new_text and "import com.sayanthrock.githubrock.ui.icons.RockIcon" not in new_text:
                  lines = new_text.splitlines()
                  index = 1 if lines and lines[0].startswith("package ") else 0
                  lines.insert(index + 1, "import com.sayanthrock.githubrock.ui.icons.RockIcon")
                  new_text = "\n".join(lines) + "\n"
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(str(path))

          if unresolved:
              print("Unresolved legacy icon names:", sorted(unresolved))
              raise SystemExit(1)

          icons_path = Path("app/src/main/java/com/sayanthrock/githubrock/ui/icons/RockIcons.kt")
          icons = icons_path.read_text(encoding="utf-8")
          additions = {
              "Business": "Business", "Pause": "Pause", "PlayArrow": "Play_arrow", "Schedule": "Schedule",
              "Share": "Share", "Link": "Link", "MoreHoriz": "More_horiz", "Email": "Email",
              "Language": "Language", "Edit": "Edit", "Menu": "Menu", "MoreVert": "More_vert",
              "FilterList": "Filter_list", "Visibility": "Visibility", "VisibilityOff": "Visibility_off",
              "PersonSearch": "Person_search",
          }
          enum_text = icons.split("fun vector", 1)[0]
          needed = [name for name in additions if not re.search(rf"\b{re.escape(name)}\b", enum_text)]
          if needed:
              icons = icons.replace(
                  "    InstallMobile, Launch, CheckBox, CheckBoxOutlineBlank;",
                  "    InstallMobile, Launch, CheckBox, CheckBoxOutlineBlank, " + ", ".join(needed) + ";",
              )
              for name in needed:
                  symbol = additions[name]
                  icons = icons.replace(
                      "import com.composables.icons.materialsymbols.rounded.Close as CloseRegular",
                      f"import com.composables.icons.materialsymbols.rounded.{symbol} as {name}Regular\nimport com.composables.icons.materialsymbols.rounded.Close as CloseRegular",
                      1,
                  )
                  icons = icons.replace(
                      "import com.composables.icons.materialsymbols.roundedfilled.Close\n",
                      f"import com.composables.icons.materialsymbols.roundedfilled.{symbol}\nimport com.composables.icons.materialsymbols.roundedfilled.Close\n",
                      1,
                  )
                  needle = "        CheckBoxOutlineBlank -> if (selected) MaterialSymbols.RoundedFilled.Check_box_outline_blank else MaterialSymbols.Rounded.CheckBoxOutlineBlankRegular\n"
                  icons = icons.replace(
                      needle,
                      needle + f"        {name} -> if (selected) MaterialSymbols.RoundedFilled.{symbol} else MaterialSymbols.Rounded.{name}Regular\n",
                      1,
                  )
              icons_path.write_text(icons, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          gradle.write_text(re.sub(r"^\s*implementation\(libs\.compose\.material\.icons\)\n", "", gradle.read_text(encoding="utf-8"), flags=re.MULTILINE), encoding="utf-8")
          catalog = Path("gradle/libs.versions.toml")
          catalog.write_text(re.sub(r"^.*compose\.material\.icons.*\n", "", catalog.read_text(encoding="utf-8"), flags=re.MULTILINE), encoding="utf-8")
          print(f"Migrated {len(changed)} production Kotlin files")

      - name: Verify no legacy Compose icons remain
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'androidx\.compose\.material\.icons|Icons\.(Default|Filled|Outlined|Rounded|Sharp|TwoTone)\.' app/src/main --include='*.kt'; then
            exit 1
          fi

      - name: Commit migration to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/production-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/build.gradle.kts gradle/libs.versions.toml .github/workflows/production-verification.yml
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "refactor(icons): complete production RockIcons migration"
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify committed Gradle wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - uses: gradle/actions/setup-gradle@v6
      - name: Run production quality gates
        run: |
          ./gradlew lint testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-verification-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
