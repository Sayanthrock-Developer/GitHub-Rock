name: Production Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_CLIENT_ID: ${{ vars.PUBLIC_GITHUB_OAUTH_CLIENT_ID || 'Ov23lim8WhLjeUMqvuMj' }}
      GITHUB_ROCK_BACKEND_URL: ${{ vars.GITHUB_ROCK_BACKEND_URL || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Verify committed Gradle wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - uses: gradle/actions/setup-gradle@v6
      - name: Run production quality gates
        run: |
          ./gradlew lint testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-verification-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
