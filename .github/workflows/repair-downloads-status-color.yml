name: Repair Downloads status color

on:
  push:
    branches:
      - fix/downloads-status-color-composable

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/downloads-status-color-composable
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix composable theme access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/sayanthrock/githubrock/ui/screens/DownloadsRedesignScreen.kt")
          text = path.read_text()
          old = "private fun downloadStatusColor(state: DownloadState): Color ="
          new = "@Composable\nprivate fun downloadStatusColor(state: DownloadState): Color ="
          if old not in text:
              raise SystemExit("Expected downloadStatusColor declaration was not found")
          if new not in text:
              path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/repair-downloads-status-color.yml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sayanthrock/githubrock/ui/screens/DownloadsRedesignScreen.kt .github/workflows/repair-downloads-status-color.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(downloads): mark status color helper composable"
          git push origin HEAD:fix/downloads-status-color-composable
