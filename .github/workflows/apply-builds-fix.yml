# Temporary self-removing patch runner for the Builds fix branch.
name: Apply Builds repository fix
on:
  push:
    branches: [fix/builds-repository-selection]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Builds screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/sayanthrock/githubrock/ui/screens/BuildsScreen.kt')
          s=p.read_text()
          s=s.replace('val requestedRunId = initialRunId.takeIf { selectedRepository?.id == initialRepository?.id }', 'val requestedRunId = initialRunId.takeIf { selectedRepository?.id == initialRepository?.id }\n    val repositoryRuns = actionState.recentRuns')
          s=s.replace('val visibleRuns = remember(runs, filter) {\n        runs.filter', 'val visibleRuns = remember(repositoryRuns, filter) {\n        repositoryRuns.filter')
          s=s.replace('val counts = remember(runs, actionState.artifacts) {\n        BuildCounts(\n            running = runs.count', 'val counts = remember(repositoryRuns, actionState.artifacts) {\n        BuildCounts(\n            running = repositoryRuns.count')
          s=s.replace('failed = runs.count', 'failed = repositoryRuns.count')
          s=s.replace('success = runs.count', 'success = repositoryRuns.count')
          s=s.replace('repositories.take(8).forEach', 'repositories.forEach')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/sayanthrock/githubrock/ui/screens/BuildsScreen.kt
          git diff --cached --quiet || git commit -m "fix(builds): show selected repository runs"
          git push
