name: Add Obsidian design style

on:
  push:
    paths:
      - .github/workflows/obsidian-style-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Obsidian style
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "app/src/main/java/com/sayanthrock/githubrock/data/settings/AppPreferences.kt",
              "enum class ThemeStyle { Clean, LiquidGlass, Studio, Midnight, Aurora, HighContrast;",
              "enum class ThemeStyle { Clean, LiquidGlass, Studio, Midnight, Aurora, HighContrast, Obsidian;"
          )

          replace(
              "app/src/main/java/com/sayanthrock/githubrock/ui/theme/Theme.kt",
              "    ThemeStyle.HighContrast -> Shapes(extraSmall = RoundedCornerShape(2.dp), small = RoundedCornerShape(4.dp), medium = RoundedCornerShape(6.dp), large = RoundedCornerShape(8.dp), extraLarge = RoundedCornerShape(12.dp))\n}",
              "    ThemeStyle.HighContrast -> Shapes(extraSmall = RoundedCornerShape(2.dp), small = RoundedCornerShape(4.dp), medium = RoundedCornerShape(6.dp), large = RoundedCornerShape(8.dp), extraLarge = RoundedCornerShape(12.dp))\n    ThemeStyle.Obsidian -> Shapes(extraSmall = RoundedCornerShape(7.dp), small = RoundedCornerShape(11.dp), medium = RoundedCornerShape(15.dp), large = RoundedCornerShape(20.dp), extraLarge = RoundedCornerShape(28.dp))\n}"
          )

          replace(
              "app/src/main/java/com/sayanthrock/githubrock/ui/theme/Theme.kt",
              "    ThemeStyle.HighContrast -> copy(\n        background = if (darkTheme) Color.Black else Color.White,\n        surface = if (darkTheme) Color(0xFF050505) else Color.White,\n        surfaceContainer = if (darkTheme) Color(0xFF0D0D0D) else Color(0xFFF4F4F4),\n        surfaceContainerHigh = if (darkTheme) Color(0xFF161616) else Color(0xFFEAEAEA),\n        outline = if (darkTheme) Color.White else Color.Black,\n        outlineVariant = if (darkTheme) Color(0xFFBDBDBD) else Color(0xFF2B2B2B),\n        onBackground = if (darkTheme) Color.White else Color.Black,\n        onSurface = if (darkTheme) Color.White else Color.Black,\n        onSurfaceVariant = if (darkTheme) Color(0xFFE3E3E3) else Color(0xFF222222)\n    )\n}",
              "    ThemeStyle.HighContrast -> copy(\n        background = if (darkTheme) Color.Black else Color.White,\n        surface = if (darkTheme) Color(0xFF050505) else Color.White,\n        surfaceContainer = if (darkTheme) Color(0xFF0D0D0D) else Color(0xFFF4F4F4),\n        surfaceContainerHigh = if (darkTheme) Color(0xFF161616) else Color(0xFFEAEAEA),\n        outline = if (darkTheme) Color.White else Color.Black,\n        outlineVariant = if (darkTheme) Color(0xFFBDBDBD) else Color(0xFF2B2B2B),\n        onBackground = if (darkTheme) Color.White else Color.Black,\n        onSurface = if (darkTheme) Color.White else Color.Black,\n        onSurfaceVariant = if (darkTheme) Color(0xFFE3E3E3) else Color(0xFF222222)\n    )\n    ThemeStyle.Obsidian -> copy(\n        background = if (darkTheme) Color(0xFF07080A) else Color(0xFFF5F6F8),\n        surface = if (darkTheme) Color(0xFF0D0F12) else Color(0xFFFCFCFD),\n        surfaceVariant = if (darkTheme) Color(0xFF111419) else Color(0xFFF0F2F5),\n        surfaceContainerLowest = if (darkTheme) Color(0xFF050608) else Color.White,\n        surfaceContainerLow = if (darkTheme) Color(0xFF0A0C0F) else Color(0xFFF7F8FA),\n        surfaceContainer = if (darkTheme) Color(0xFF12151A) else Color(0xFFF0F2F5),\n        surfaceContainerHigh = if (darkTheme) Color(0xFF191D23) else Color(0xFFE7EAF0),\n        surfaceContainerHighest = if (darkTheme) Color(0xFF222730) else Color(0xFFDCE1E8),\n        outline = if (darkTheme) Color(0xFF343B45) else Color(0xFFB8C0CA),\n        outlineVariant = if (darkTheme) Color(0xFF242A32) else Color(0xFFD9DEE5),\n        onBackground = if (darkTheme) Color(0xFFF1F3F5) else Color(0xFF16191D),\n        onSurface = if (darkTheme) Color(0xFFF1F3F5) else Color(0xFF16191D),\n        onSurfaceVariant = if (darkTheme) Color(0xFFAAB2BD) else Color(0xFF59636E)\n    )\n}"
          )

          replace(
              "app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt",
              "item { ChoiceCard(\"Design style\", \"Six complete surface and shape systems\", Icons.Default.Palette, ThemeStyle.entries.map { it to it.displayName }, state.themeStyle, onThemeStyle) }",
              "item { ChoiceCard(\"Design style\", \"Seven complete surface and shape systems\", Icons.Default.Palette, ThemeStyle.entries.map { it to it.displayName }, state.themeStyle, onThemeStyle) }"
          )

          replace(
              "app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt",
              "ThemeStyle.HighContrast -> \"High contrast\" }",
              "ThemeStyle.HighContrast -> \"High contrast\"; ThemeStyle.Obsidian -> \"Obsidian\" }"
          )

          test = Path("app/src/test/java/com/sayanthrock/githubrock/AppearancePreferencesTest.kt")
          text = test.read_text()
          needle = 'assertEquals(ThemeStyle.Midnight, ThemeStyle.fromStored("Midnight"))'
          if needle in text and 'ThemeStyle.Obsidian' not in text:
              text = text.replace(needle, needle + '\n        assertEquals(ThemeStyle.Obsidian, ThemeStyle.fromStored("Obsidian"))', 1)
              test.write_text(text)
          PY

          rm .github/workflows/obsidian-style-trigger
          rm .github/workflows/add-obsidian-style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sayanthrock/githubrock/data/settings/AppPreferences.kt app/src/main/java/com/sayanthrock/githubrock/ui/theme/Theme.kt app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt app/src/test/java/com/sayanthrock/githubrock/AppearancePreferencesTest.kt .github/workflows
          git commit -m "feat: add Obsidian design style"
          git push
