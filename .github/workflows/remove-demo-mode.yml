name: Remove legacy demo mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-demo-mode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy demo-mode implementation
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          (root / 'app/src/main/java/com/sayanthrock/githubrock/data/demo/DemoData.kt').unlink(missing_ok=True)
          def edit(path, transform):
              p = root / path
              p.write_text(transform(p.read_text()))
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/GitHubRockRoot.kt', lambda s: '\n'.join(line for line in s.splitlines() if 'onDemo' not in line) + '\n')
          def login(s):
              s = '\n'.join(line for line in s.splitlines() if 'onDemo' not in line and 'Explore isolated demo mode' not in line) + '\n'
              return s.replace('Guest and demo modes still work.', 'Guest access is still available.')
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/LoginScreen.kt', login)
          def nav(s):
              s = re.sub(r'\?demo=\$\{mode == AppMode\.Demo\}', '', s)
              s = s.replace('?demo={demo}', '')
              s = re.sub(r',\s*navArgument\("demo"\)\s*\{.*?\}', '', s, flags=re.S)
              return s
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/navigation/AppNavigation.kt', nav)
          def hub(s):
              s = s.replace('import com.sayanthrock.githubrock.data.demo.DemoData\n', '')
              s = re.sub(r'\n\s*private val demo: Boolean = savedStateHandle\["demo"\] \?: false', '', s)
              s = re.sub(r'\n\s*if \(demo\) \{.*?\n\s*_state\.update \{', '\n\n        _state.update {', s, flags=re.S, count=1)
              s = re.sub(r'\n\s*val DEMO_RELEASES = listOf\(.*?\n\s*const val DEMO_README = """.*?\n"""', '', s, flags=re.S)
              return s
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/RepositoryHubViewModel.kt', hub)
          def showcase(s):
              s = s.replace('import com.sayanthrock.githubrock.data.demo.DemoData\n', '')
              s = re.sub(r'\n\s*private val demo: Boolean = savedStateHandle\["demo"\] \?: false', '', s)
              s = re.sub(r'\n\s*if \(demo\) \{.*?\n\s*\}\n\n\s*_state\.update \{', '\n\n        _state.update {', s, flags=re.S, count=1)
              s = re.sub(r'\n\s*const val DEMO_README = """.*?\n"""', '', s, flags=re.S)
              return s
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/RepositoryShowcaseViewModel.kt', showcase)
          def file_manager(s):
              s = s.replace('import com.sayanthrock.githubrock.data.demo.DemoData\n', '')
              s = re.sub(r'\n\s*private val demo: Boolean = savedStateHandle\["demo"\] \?: false', '', s)
              s = s.replace('val entries = if (demo) DemoData.contents else repository.contents(owner, repo, normalized, defaultBranch)', 'val entries = repository.contents(owner, repo, normalized, defaultBranch)')
              s = re.sub(r'val content = if \(demo\) \{.*?\n\s*\} else \{\n\s*SourceFileDecoder\.decode\(repository\.file\(owner, repo, entry\.path, defaultBranch\)\)\n\s*\}', 'val content = SourceFileDecoder.decode(repository.file(owner, repo, entry.path, defaultBranch))', s, flags=re.S)
              s = re.sub(r'\n\s*if \(demo\) \{.*?return@launch\s*\}', '', s, flags=re.S)
              return s
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/RepositoryFileManagerViewModel.kt', file_manager)
          def detail(s):
              s = s.replace('import com.sayanthrock.githubrock.data.demo.DemoData\n', '')
              s = re.sub(r'\n\s*private val demo: Boolean = savedStateHandle\["demo"\] \?: false', '', s)
              s = re.sub(r'val entry = if \(demo\) \{.*?\n\s*\} else \{\n\s*repository\.file\(owner, repo, path, baseBranch\)\n\s*\}', 'val entry = repository.file(owner, repo, path, baseBranch)', s, flags=re.S)
              s = re.sub(r'val content = if \(demo\) \{.*?\n\s*\} else \{\n\s*SourceFileDecoder\.decode\(entry\)\n\s*\}', 'val content = SourceFileDecoder.decode(entry)', s, flags=re.S)
              s = re.sub(r'val branchProtected = if \(demo\) false else runCatching \{', 'val branchProtected = runCatching {', s)
              s = re.sub(r'\n\s*if \(demo\) \{.*?return@launch\s*\}', '', s, flags=re.S)
              s = s.replace('runCatching { if (demo) emptyList() else repository.issueComments(owner, repo, issueNumber) }', 'runCatching { repository.issueComments(owner, repo, issueNumber) }')
              s = s.replace('runCatching { if (demo) emptyList() else repository.pullReviews(owner, repo, pullNumber) }', 'runCatching { repository.pullReviews(owner, repo, pullNumber) }')
              s = s.replace('if (demo) loadDemo(section) else when (section)', 'when (section)')
              s = re.sub(r'\n\s*private fun loadDemo\(section: RepoSection\) \{.*?\n\s*\}\n\n\s*private fun isSafeFilePath', '\n\n    private fun isSafeFilePath', s, flags=re.S)
              return s
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/RepositoryDetailViewModel.kt', detail)
          def detail_screen(s):
              s = s.replace('enabled = !demo && changed &&', 'enabled = changed &&')
              return re.sub(r'\n\s*if \(demo\) Text\("Demo mode never commits to GitHub\."[^\n]*\)', '', s)
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/RepositoryDetailScreen.kt', detail_screen)
          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/FeaturePreviewScreen.kt', lambda s: '\n'.join(line for line in s.splitlines() if 'Isolated demo mode' not in line) + '\n')
          edit('app/src/androidTest/java/com/sayanthrock/githubrock/LoginScreenTest.kt', lambda s: '\n'.join(line for line in s.splitlines() if 'onDemo = {}' not in line and 'Explore isolated demo mode' not in line) + '\n')
      - name: Verify demo mode is completely absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/java/com/sayanthrock/githubrock/data/demo/DemoData.kt
          if grep -Rni --exclude-dir=.git -E 'DemoData|AppMode\.Demo|enterDemo|onDemo|Explore isolated demo mode|\?demo=|data/demo|Demo mode|demo-mode' app; then
            echo 'Legacy demo-mode references remain.'
            exit 1
          fi
          echo 'Legacy demo mode fully removed.'
      - name: Remove this one-time cleanup workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove-demo-mode.yml
          git add -A
          git commit -m 'Remove legacy demo mode completely'
          git push
