name: Normalize Downloads composable annotation

on:
  push:
    branches:
      - fix/navigation-ios-307-verification

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Normalize helper annotation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sayanthrock/githubrock/ui/screens/DownloadsRedesignScreen.kt')
          s = p.read_text()
          old = '@Composable\n@Composable\nprivate fun downloadStatusColor'
          new = '@Composable\nprivate fun downloadStatusColor'
          if old in s:
              s = s.replace(old, new, 1)
          elif '@Composable\nprivate fun downloadStatusColor' not in s:
              s = s.replace('private fun downloadStatusColor', '@Composable\nprivate fun downloadStatusColor', 1)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-downloads-compose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayanthrock/githubrock/ui/screens/DownloadsRedesignScreen.kt .github/workflows/fix-downloads-compose.yml
          git commit -m 'fix: normalize download status helper annotation'
          git push
