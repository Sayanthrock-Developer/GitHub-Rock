name: Remove Application Blur

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Application Blur everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def edit(path, patterns):
              p = Path(path)
              s = p.read_text()
              for pattern, replacement in patterns:
                  s2, count = re.subn(pattern, replacement, s, flags=re.MULTILINE | re.DOTALL)
                  if count == 0:
                      raise SystemExit(f'pattern not found: {path}: {pattern}')
                  s = s2
              p.write_text(s)

          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt', [
              (r'^import com\.sayanthrock\.githubrock\.ui\.blur\.[^\n]*\n', ''),
              (r'^    val blurState by viewModel\.blurState\.collectAsStateWithLifecycle\(\)\n', ''),
              (r'        blurState = blurState,\n        onBlurMode = viewModel::setBlurMode,\n        onBlurPreset = viewModel::setBlurPreset,\n        onBlurProfile = viewModel::setBlurProfile,\n        onBlurCustomTint = viewModel::setBlurCustomTint,\n        onBlurComponentProfile = viewModel::setBlurComponentProfile,\n        onBlurReset = viewModel::resetBlurSettings,\n', ''),
              (r'    blurState: ApplicationBlurSettings.*?\n    onBlurReset: \(\) -> Unit = \{\},\n', ''),
              (r'            item \{ StandardSectionHeader\("Application Blur"\) \}.*?(?=            item \{ StandardSectionHeader\("Display size"\) \})', ''),
          ])

          edit('app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceViewModel.kt', [
              (r'^import com\.sayanthrock\.githubrock\.data\.settings\.ApplicationBlurPreferences\n', ''),
              (r'^import com\.sayanthrock\.githubrock\.ui\.blur\.[^\n]*\n', ''),
              (r'    private val preferences: AppPreferences,\n    private val blurPreferences: ApplicationBlurPreferences\n', '    private val preferences: AppPreferences\n'),
              (r'^    val blurState: StateFlow<ApplicationBlurSettings> = .*\n', ''),
              (r'\n    fun setBlurMode\(mode: ApplicationBlurMode\).*?(?=\n    fun resetAppearance\(\))', '\n'),
          ])

          edit('app/src/main/java/com/sayanthrock/githubrock/ui/GitHubRockRoot.kt', [
              (r'^    val blurState by appearanceViewModel\.blurState\.collectAsStateWithLifecycle\(\)\n', ''),
              (r', blurSettings = blurState', ''),
          ])

          p = Path('app/src/main/java/com/sayanthrock/githubrock/ui/navigation/RockNavigationChrome.kt')
          s = p.read_text()
          s = re.sub(r'^import com\.sayanthrock\.githubrock\.ui\.blur\.[^\n]*\n', '', s, flags=re.M)
          s = re.sub(r', blurSettings: ApplicationBlurSettings(?: = ApplicationBlurSettings\(\))?', '', s)
          s = re.sub(r', blurSettings(?=[,)])', '', s)
          start = s.index('@Composable\nprivate fun NavigationSurface(')
          end = s.index('\nprivate fun navigationSlideGesture', start)
          replacement = '''@Composable
private fun NavigationSurface(modifier: Modifier, shape: RoundedCornerShape, color: Color, borderAlpha: Float, shadow: Dp, maxWidth: Dp, onDestinationSelected: (TopDestinationV2) -> Unit, content: @Composable () -> Unit) {
    val view = LocalView.current
    val slideModifier = navigationSlideGesture(view, onDestinationSelected)
    Surface(
        modifier = modifier.navigationBarsPadding().padding(horizontal = 12.dp, vertical = 10.dp).widthIn(max = maxWidth).fillMaxWidth().then(slideModifier),
        shape = shape,
        color = color,
        contentColor = MaterialTheme.colorScheme.onSurface,
        border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant.copy(alpha = borderAlpha)),
        tonalElevation = 2.dp,
        shadowElevation = shadow,
    ) { content() }
}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          for path in [
              'app/src/main/java/com/sayanthrock/githubrock/ui/blur/ApplicationBlur.kt',
              'app/src/main/java/com/sayanthrock/githubrock/ui/screens/ApplicationBlurEditor.kt',
              'app/src/main/java/com/sayanthrock/githubrock/ui/screens/ApplicationBlurDefaults.kt',
              'app/src/main/java/com/sayanthrock/githubrock/data/settings/ApplicationBlurPreferences.kt',
              'app/src/test/java/com/sayanthrock/githubrock/ui/blur/ApplicationBlurTest.kt',
          ]:
              subprocess.run(['git', 'rm', '-f', path], check=True)

          residual = subprocess.run(['grep', '-RInE', 'ApplicationBlur|applicationBlur|github_rock_blur_preferences|ui\.blur', 'app/src'], capture_output=True, text=True)
          if residual.returncode == 0 and residual.stdout.strip():
              raise SystemExit('Residual Application Blur references:\n' + residual.stdout)
          PY

      - name: Verify removal
        run: |
          if grep -RInE 'ApplicationBlur|applicationBlur|github_rock_blur_preferences|ui\.blur' app/src; then exit 1; fi
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Commit removal and delete cleanup artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/remove-application-blur.yml .github/application-blur-cleanup-trigger
          git add -A
          git commit -m 'chore: remove application blur completely [cleanup]'
          git push
