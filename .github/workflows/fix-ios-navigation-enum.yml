name: Complete iOS navigation enum migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add iOS navigation display label and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt")
          text = path.read_text()
          old = 'NavigationBarStyle.Compact -> "Compact" }'
          new = 'NavigationBarStyle.Compact -> "Compact"; NavigationBarStyle.Ios -> "iOS" }'
          if old not in text:
              raise SystemExit("expected navigation display-name mapping was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-ios-navigation-enum.yml
          if git diff --quiet; then
            echo "No migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt .github/workflows/fix-ios-navigation-enum.yml
          git commit -m "fix(navigation): expose iOS style in appearance settings"
          git push origin HEAD:main
