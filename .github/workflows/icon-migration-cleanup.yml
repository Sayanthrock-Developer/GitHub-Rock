name: One-time Rock icon migration cleanup

on:
  push:
    branches:
      - fix/icon-migration-302

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize RockIcon registry
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java')
          rock = root / 'com/sayanthrock/githubrock/ui/icons/RockIcons.kt'
          text = rock.read_text()

          # Remove duplicate import lines while preserving order.
          lines = text.splitlines()
          seen_imports = set()
          out = []
          for line in lines:
              if line.startswith('import '):
                  if line in seen_imports:
                      continue
                  seen_imports.add(line)
              out.append(line)
          text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')

          # Make enum entries unique while preserving the existing order.
          start = text.index('enum class RockIcon {') + len('enum class RockIcon {')
          end = text.index('\n}', start)
          entries = []
          seen = set()
          for item in text[start:end].replace('\n', ' ').split(','):
              name = item.strip()
              if name and name not in seen:
                  seen.add(name)
                  entries.append(name)
          enum_body = '\n    ' + ',\n    '.join(entries)
          text = text[:start] + enum_body + text[end:]

          # Remove duplicate when branches, keeping the first mapping so existing
          # selected/unselected mappings remain authoritative.
          lines = text.splitlines()
          seen_cases = set()
          out = []
          for line in lines:
              m = re.match(r'\s*RockIcon\.([A-Za-z0-9_]+)\s*->', line)
              if m:
                  name = m.group(1)
                  if name in seen_cases:
                      continue
                  seen_cases.add(name)
              out.append(line)
          text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
          rock.write_text(text)

          # Confirm every production usage is backed by the centralized enum.
          usages = set()
          for path in root.rglob('*.kt'):
              if path == rock:
                  continue
              usages.update(re.findall(r'RockIcon\.([A-Za-z0-9_]+)\.vector\(\)', path.read_text()))
          enum_names = set(seen)
          missing = sorted(usages - enum_names)
          if missing:
              raise SystemExit('Missing RockIcon enum entries: ' + ', '.join(missing))
          print('Normalized RockIcon registry; production usages:', len(usages))
          PY
      - name: Verify no legacy icon APIs remain
        run: |
          if grep -RIn --include='*.kt' -E 'androidx\.compose\.material\.icons|Icons\.(Default|Filled|Outlined|Rounded|Sharp|TwoTone)\.' app/src/main/java; then
            exit 1
          fi
      - name: Commit cleanup and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git rm .github/workflows/icon-migration-cleanup.yml
          git commit -m 'fix: normalize Rock icon registry #302' || exit 0
          git push
