name: Finalize Application Blur Removal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the existing cleanup workflow
        run: sleep 180

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove all Application Blur remnants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          rm -f \
            app/src/main/java/com/sayanthrock/githubrock/ui/blur/ApplicationBlur.kt \
            app/src/main/java/com/sayanthrock/githubrock/ui/screens/ApplicationBlurEditor.kt \
            app/src/main/java/com/sayanthrock/githubrock/ui/screens/ApplicationBlurDefaults.kt \
            app/src/main/java/com/sayanthrock/githubrock/data/settings/ApplicationBlurPreferences.kt \
            app/src/test/java/com/sayanthrock/githubrock/ui/blur/ApplicationBlurTest.kt \
            .github/workflows/remove-application-blur.yml \
            .github/workflows/finalize-application-blur-removal.yml

          python - <<'PY'
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          replace('app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceScreen.kt', [
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurMode\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurPreset\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurProfile\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurSettings\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurComponent\n', ''),
              ('    val blurState by viewModel.blurState.collectAsStateWithLifecycle()\n', ''),
              ('''        blurState = blurState,
        onBlurMode = viewModel::setBlurMode,
        onBlurPreset = viewModel::setBlurPreset,
        onBlurProfile = viewModel::setBlurProfile,
        onBlurCustomTint = viewModel::setBlurCustomTint,
        onBlurComponentProfile = viewModel::setBlurComponentProfile,
        onBlurReset = viewModel::resetBlurSettings,
''', ''),
              ('''    blurState: ApplicationBlurSettings = ApplicationBlurPreset.Clean.toSettings(),
    onBlurMode: (ApplicationBlurMode) -> Unit = {},
    onBlurPreset: (ApplicationBlurPreset) -> Unit = {},
    onBlurProfile: (ApplicationBlurProfile) -> Unit = {},
    onBlurCustomTint: (String) -> Unit = {},
    onBlurComponentProfile: (ApplicationBlurComponent, ApplicationBlurProfile?) -> Unit = { _, _ -> },
    onBlurReset: () -> Unit = {},
''', ''),
              ('''            item { StandardSectionHeader("Application Blur") }
            item {
                ApplicationBlurEditor(
                    settings = blurState,
                    onMode = onBlurMode,
                    onPreset = onBlurPreset,
                    onProfile = onBlurProfile,
                    onCustomTint = onBlurCustomTint,
                    onComponentProfile = onBlurComponentProfile,
                    onReset = onBlurReset,
                )
            }
''', ''),
          ])

          replace('app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceViewModel.kt', [
              ('import com.sayanthrock.githubrock.data.settings.ApplicationBlurPreferences\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurComponent\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurMode\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurPreset\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurProfile\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.ApplicationBlurSettings\n', ''),
              ('import com.sayanthrock.githubrock.ui.blur.toSettings\n', ''),
              ('''    private val preferences: AppPreferences,
    private val blurPreferences: ApplicationBlurPreferences
''', '''    private val preferences: AppPreferences
'''),
              ('    val blurState: StateFlow<ApplicationBlurSettings> = blurPreferences.settings.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), ApplicationBlurPreset.Clean.toSettings())\n', ''),
          ])
          p = Path('app/src/main/java/com/sayanthrock/githubrock/ui/screens/AppearanceViewModel.kt')
          s = p.read_text()
          start = s.index('    fun setBlurMode(')
          end = s.index('    fun resetAppearance()', start)
          p.write_text(s[:start] + s[end:])

          replace('app/src/main/java/com/sayanthrock/githubrock/ui/GitHubRockRoot.kt', [
              ('    val blurState by appearanceViewModel.blurState.collectAsStateWithLifecycle()\n', ''),
              (', blurSettings = blurState', ''),
          ])

          nav = Path('app/src/main/java/com/sayanthrock/githubrock/ui/navigation/RockNavigationChrome.kt')
          s = nav.read_text()
          for line in [
              'import com.sayanthrock.githubrock.ui.blur.ApplicationBlurComponent\n',
              'import com.sayanthrock.githubrock.ui.blur.ApplicationBlurSettings\n',
              'import com.sayanthrock.githubrock.ui.blur.ApplicationBlurSurface\n',
          ]:
              s = s.replace(line, '')
          s = s.replace(', blurSettings: ApplicationBlurSettings = ApplicationBlurSettings()', '')
          s = s.replace(', blurSettings: ApplicationBlurSettings', '')
          s = s.replace(', blurSettings', '')
          start = s.index('@Composable\nprivate fun NavigationSurface(')
          end = s.index('\nprivate fun navigationSlideGesture', start)
          replacement = '''@Composable
private fun NavigationSurface(modifier: Modifier, shape: RoundedCornerShape, color: Color, borderAlpha: Float, shadow: Dp, maxWidth: Dp, onDestinationSelected: (TopDestinationV2) -> Unit, content: @Composable () -> Unit) {
    val view = LocalView.current
    val slideModifier = navigationSlideGesture(view, onDestinationSelected)
    Surface(modifier = modifier.navigationBarsPadding().padding(horizontal = 12.dp, vertical = 10.dp).widthIn(max = maxWidth).then(slideModifier), shape = shape, color = color, contentColor = MaterialTheme.colorScheme.onSurface, border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant.copy(alpha = borderAlpha)), tonalElevation = 2.dp, shadowElevation = shadow) { content() }
}
'''
          nav.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Verify zero remnants
        run: |
          if grep -RInE 'ApplicationBlur|applicationBlur|github_rock_blur_preferences|ui\\.blur' app/src .github 2>/dev/null; then
            echo 'Application Blur references remain.'
            exit 1
          fi

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove application blur completely [final]' || exit 0
          git push origin main
